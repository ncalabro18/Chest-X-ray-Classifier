# nginx.conf
# Serves the Angular SPA and reverse-proxies /submit -> web:8000

worker_processes auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Redirect all temp dirs to /tmp (world-writable, on tmpfs)
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens off;   # don't advertise nginx version

    # Limit upload body size to match web service (10 MB + headroom)
    client_max_body_size 11M;

    server {
        listen 4000;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        access_log /dev/stdout;

        # Health check
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 
        location = /status {
            proxy_pass http://web:8000;
        }

        # Proxy /submit -> FastAPI web service
        location = /submit {
            proxy_pass         http://web:8000/submit;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 35s;
        }

        # Cache hashed asset bundles aggressively
        # Note: avoid {n,m} quantifiers - nginx treats { } as variable syntax
        location ~* \.[0-9a-f]+\.(js|css|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Angular SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}