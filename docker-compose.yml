# docker-compose.yml

# classifier runs the ML model API

# web runs the exposed API frontend sends requests to

# caddy proxies requests to web, frontend, and classifier
# using TLS

# frontend runs the Angular nginx server
# prometheus collects useful metrics
# grafana displays them in a browser

# frontend and web are to be served with public access
# the rest (in particular Classifier) should be private

# run services for testing with docker-compose up

# use make deploy scans for common vulnerabilities and explosures
# this runs the scan profile, the cve-scan service

services:

  classifier:
    build:
      context: .
      dockerfile: Dockerfile.classifier
    image: local-classifier:latest
    environment:
      PYTHONUNBUFFERED: "1"
      NO_ALBUMENTATIONS_UPDATE: "1"
      API_KEY: "${CLASSIFIER_API_KEY}"
    expose:
      - "9000" # API
      - "9091" # Monitoring
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend
      - monitoring
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PYTHONDONTWRITEBYTECODE=1 python3 -c \"import os, urllib.request; req = urllib.request.Request('http://localhost:9000/ready', headers={'X-API-Key': os.environ.get('API_KEY', '')}); urllib.request.urlopen(req, timeout=5)\""
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s # failures dont count to retries until this ends

  
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: local-web:latest
    environment:
      CLASSIFIER_API_KEY: "${CLASSIFIER_API_KEY}"
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MAX_BYTES: "10485760"
    expose:
      - "9091"
      - "8000"
    depends_on:
      classifier:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend    # reaches classifier
      - dmz        # reachable by frontend
      - monitoring

    healthcheck:
      test:
        [
        "CMD-SHELL",
        "python3 -c \"import urllib.request; import sys; \
        sys.exit(0 if urllib.request.urlopen('http://localhost:8000/status', timeout=5).status == 200 else 1)\""
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./frontend   # directory containing the Angular project
      dockerfile: ../Dockerfile.frontend
    image: local-frontend:latest
    expose:
      - "4000"
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101   # nginx user in alpine is uid/gid 101
      - /var/cache/nginx
      - /var/run
    networks:
      - dmz        # proxies to web, no direct backend access
      - monitoring

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -i http://localhost:4000/health | grep -q ok"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s


  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}    
    # --config /etc/cloudflared/config.yml
    # volumes:
    #  - ./tunnel_config.yml:/etc/cloudflared/config.yml
    
    networks:
      - ingress

          
    depends_on:
      caddy:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  caddy:
    image: caddy:2

    restart: unless-stopped

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/etc/caddy/certs

    depends_on:
      frontend:
        condition: service_healthy
    
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET}

    expose:
      - "80"
      - "443"

    networks:
      - ingress
      - dmz
      - monitoring

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:80/ >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring


  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://localhost/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_USERS_ALLOW_SIGN_UP: false
    depends_on:
      - prometheus
    networks:
      - monitoring
    profiles:
      - monitoring

# exports nginx promentheus metrics
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - --nginx.scrape-uri=http://frontend:4000/stub_status
    expose:
      - "9113"
    depends_on:
      frontend:
        condition: service_healthy

    networks:
      - monitoring

  # has its own profile; not run with docker-compose up
  cve-scan:
    image: aquasec/trivy:latest
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      image
      --severity HIGH,CRITICAL
      --exit-code 1
      --quiet
      local-web:latest local-classifier:latest
    profiles:
      - scan   # only runs when explicitly invoked



networks:
  ingress:
    driver: bridge

  dmz:
    driver: bridge
    internal: true

  # Internal network: web -> classifier only
  backend:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge
    internal: true



volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config: