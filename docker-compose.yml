# Chest X-ray Multi Label Classifier - docker-compose.yml
# use this file to deploy or locally test the AI model web interface
# see README.md for instructions to execute this file
# it also has a network topology digram to show how microservices communicate

# classifier runs the ML model API

# web runs the exposed API that frontend (Nginx) sends requests to


# frontend runs the Angular nginx server
# prometheus collects useful metrics
# grafana displays them in a browser
# caddy serves as a reverse proxy from the tunnel and adds a secret header web verifies
#   TLS is terminated at cloudflared, not caddy



# use make cve-scan for common vulnerabilities and explosures
# this runs the scan profile, the cve-scan service

# for best security posture, keep grafana and caddy-dev service
# active only when in use (by non threat-actors)

services:

  classifier:
    profiles:
      - deploy
    build:
      context: .
      dockerfile: Dockerfile.classifier
    image: local-classifier:latest
    environment:
      PYTHONUNBUFFERED: "1"
      NO_ALBUMENTATIONS_UPDATE: "1"
      API_KEY: "${CLASSIFIER_API_KEY}"
    expose:
      - "9000" # API
      - "9091" # Monitoring
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend
      - monitoring
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PYTHONDONTWRITEBYTECODE=1 python3 -c \"import os, urllib.request; req = urllib.request.Request('http://localhost:9000/ready', headers={'X-API-Key': os.environ.get('API_KEY', '')}); urllib.request.urlopen(req, timeout=5)\""
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s # failures dont count to retries until this ends

  
  # web monitors classifier, ratelimits requests, raises exceptions to
  # invalid images, and serves as an extra layer of security
  web:
    profiles:
      - deploy
    build:
      context: .
      dockerfile: Dockerfile.web
    image: local-web:latest
    environment:
      CLASSIFIER_API_KEY: "${CLASSIFIER_API_KEY}"
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MAX_BYTES: "10485760"
      CLASSIFIER_URL: "http://classifier:9000"
    expose:
      - "9091"
      - "8000"
    depends_on:
      classifier:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend    # reaches classifier
      - dmz        # reachable by frontend
      - monitoring

    healthcheck:
      test:
        [
        "CMD-SHELL",
        "python3 -c \"import urllib.request; import sys; \
        sys.exit(0 if urllib.request.urlopen('http://localhost:8000/status', timeout=5).status == 200 else 1)\""
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    profiles:
      - deploy
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    image: local-frontend:latest
    expose:
      - "4000"
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101   # nginx user in alpine is uid/gid 101
      - /var/cache/nginx
      - /var/run
    networks:
      - dmz        # proxies to web, no direct backend access
      - monitoring

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -i http://localhost:4000/health | grep -q ok"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s


  prometheus:
    profiles:
      - deploy
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring

  # exports nginx promentheus metrics
  nginx-exporter:
    profiles:
      - deploy
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - --nginx.scrape-uri=http://frontend:4000/stub_status
    expose:
      - "9113"
    depends_on:
      frontend:
        condition: service_healthy

    networks:
      - monitoring


  # Cloudflare Tunnel
  # requires an API and tunnel token in .env
  cloudflared:
    profiles:
      - deploy
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - ingress # only access point to ingress
      - caddy_internal
          
    depends_on:
      caddy:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# TLS terminates at cloudflared
# used as a reverse proxy only
  caddy:
    profiles:
      - deploy
    image: caddy:2

    restart: unless-stopped

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/etc/caddy/certs

    depends_on:
      frontend:
        condition: service_healthy
    
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET}

    expose:
      - "80"
      - "443"

    networks:
      - caddy_internal
      - dmz
      - monitoring
   
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qS http://localhost:80/ 2>&1 | grep -q 'HTTP/'"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # displays metrics in a web application
  grafana:
    # do not run by default; security concern
    # run grafana when it is being used only
    # keeping it under the monitoring profile disables it by default
    profiles:
      - monitoring

    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "http://0.0.0.0:3000/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_SECURITY_DISABLE_GRAVATAR: true
      GF_USERS_ALLOW_SIGN_UP: false
    depends_on:
      - prometheus
    networks:
      - monitoring
      - grafana_ingress


  ### Begin Local Development Services ###
  classifier-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.classifier
    image: local-classifier:latest
    environment:
      PYTHONUNBUFFERED: "1"
      NO_ALBUMENTATIONS_UPDATE: "1"
      API_KEY: "${CLASSIFIER_API_KEY}"
    expose:
      - "9000" # API
      - "9091" # Monitoring
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend-dev
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PYTHONDONTWRITEBYTECODE=1 python3 -c \"import os, urllib.request; req = urllib.request.Request('http://localhost:9000/ready', headers={'X-API-Key': os.environ.get('API_KEY', '')}); urllib.request.urlopen(req, timeout=5)\""
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s # failures dont count to retries until this ends
  

  caddy-dev:
    profiles:
      - dev
    image: caddy:2

    restart: unless-stopped

    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data-dev:/data
      - caddy_config-dev:/config
      - ./certs:/etc/caddy/certs

    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET}

    # use ports on caddy-dev
    ports:
      - "127.0.0.1:14000:14000"

    networks:
      - ingress-dev
      - dmz-dev

  
  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend.dev
    image: local-frontend-dev:latest
    expose:
      - "4000"
    depends_on:
      - web-dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101   # nginx user in alpine is uid/gid 101
      - /var/cache/nginx
      - /var/run
    networks:
      - dmz-dev        # proxies to web, no direct backend access

  # web monitors classifier, ratelimits requests, raises exceptions to
  # invalid images, and serves as an extra layer of security
  web-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.web
    image: local-web:latest
    environment:
      CLASSIFIER_API_KEY: "${CLASSIFIER_API_KEY}"
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MAX_BYTES: "10485760"
      CLASSIFIER_URL: "http://classifier-dev:9000"
    expose:
      - "9091"
      - "8000"
    depends_on:
      - classifier-dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    networks:
      - backend-dev
      - dmz-dev



  # has its own profile; not run with docker-compose up
  cve-scan:
    image: aquasec/trivy:latest
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      image
      --severity HIGH,CRITICAL
      --exit-code 1
      --quiet
      local-web:latest local-classifier:latest
    profiles:
      - scan   # only runs when explicitly invoked



networks:

  # ingress is the only public network that is run continously
  ingress:
    driver: bridge

  caddy_internal:
    driver: bridge
    internal: true

  dmz:
    driver: bridge
    internal: true

  # Internal network: web -> classifier only
  backend:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge
    internal: true


  dmz-dev:
    driver: bridge
    internal: true

  backend-dev:
    driver: bridge
    internal: true


  ### Should not stay active ###
  ingress-dev:
    driver: bridge
  grafana_ingress:
    driver: bridge



volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  caddy_data-dev:
  caddy_config-dev:
